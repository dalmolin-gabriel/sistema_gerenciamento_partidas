services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: partidas
      POSTGRES_PASSWORD: partidas
      POSTGRES_DB: partidas
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partidas"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://partidas:partidas@db:5432/partidas
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
      TIMEZONE: America/Sao_Paulo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
