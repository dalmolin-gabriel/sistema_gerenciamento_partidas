{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao-form estreito">
  <h1>Entrar</h1>
  {% if erro %}<div class="aviso aviso-erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/entrar" class="form">
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label class="campo"><span>E-mail</span>
      <input type="email" name="email" value="{{ form.get('email', '') }}" required autofocus autocomplete="email"></label>
    <label class="campo"><span>Senha</span>
      <input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="btn btn-largo">Entrar</button>
  </form>
  <p class="rodape-form">Ainda não tem conta? <a href="/cadastro">Crie agora</a></p>
</div>
{% endblock %}
