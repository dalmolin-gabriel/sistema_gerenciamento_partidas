name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partidas
          POSTGRES_PASSWORD: partidas
          POSTGRES_DB: partidas_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U partidas" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://partidas:partidas@localhost:5432/partidas_teste
      DATABASE_URL: postgresql+psycopg://partidas:partidas@localhost:5432/partidas_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrações aplicam do zero
        run: alembic upgrade head && alembic downgrade base
      - name: Testes
        run: pytest -q
